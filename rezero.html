<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>PeakdleV2 - Re:Zero</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <link rel="icon" type="image/x-icon" href="img/Flogo.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PeakdleV2: The ultimate daily guessing game for Re:Zero, Konosuba and Mushoku Tensei characters. Test your knowledge.">
</head>
<body class="rezero-page">

    <button id="openGalleryBtn">☰</button>

    <div id="sideGallery" class="side-gallery">
        <div class="gallery-header">
            <h3>A little help</h3>
            <button id="closeGalleryBtn">✕</button>
        </div>
        <div id="galleryContent"></div>
    </div>
<div class="main-container">
        
        <a href="index.html" id="nextBtn">Hub</a>
        
    
        <h1>PeakdleV2</h1>
        <button id="endlessBtn">Endless Mode: OFF</button>
        <p>Daily Re:Zero characters. (anime only - Arc 6)</p>
        <div class="timer-container">
        Next character: <span id="timer">00:00:00</span>
        </div>
        <br>
        
        <div class="search-container">
            <input type="text" id="guessInput" placeholder="Name" autocomplete="off">
            <ul id="suggestions"></ul>
        </div>

        <button id="guessBtn">Guess</button>
        <button id="hintBtn">Hint</button>
        

        <p id="hintDisplay" style="color: #ffffff; font-style: italic; margin-top: 10px;"></p>

        <p>Tries: <span id="attemptCount">0</span></p>

    <div id="winPopup" class="popup-overlay" style="display:none;">
        <div class="popup-content">
            <h2 id="winMessage"></h2>
            <button onclick="closePopup()">Close</button>
        </div>
    </div>

        <div class="header-row">
            <div class="header-box">Img</div>
            <div class="header-box">Name</div>
            <div class="header-box">Gender</div>
            <div class="header-box">Role</div>
            <div class="header-box">Race</div>
            <div class="header-box">Age</div>
            <div class="header-box">Hair</div>
            <div class="header-box">Eyes</div>
            <div class="header-box">Affiliation</div>
            <div class="header-box">Arc</div>
        </div>
        <div id="gameBoard"></div>
        <div id="winPopup" class="popup-overlay">
    
    </div>
</div>  
<script src="js.js"></script>
</body>
</html>
